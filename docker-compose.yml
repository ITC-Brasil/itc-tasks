# Produção no glpi-srv (/home/glpissh/docker/itc-tasks) — docs/INFRA.md §6.
# Senhas só no .env da pasta. Sem label do Watchtower: imagens construídas localmente (ADR-027).
services:
  itc-tasks:
    build: .
    image: itc-tasks:local
    container_name: itc-tasks
    restart: always
    ports:
      - 127.0.0.1:3021:3000
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - itc-tasks-uploads:/data/uploads
    depends_on:
      itc-tasks-db:
        condition: service_healthy

  itc-tasks-worker:
    image: itc-tasks:local
    container_name: itc-tasks-worker
    restart: always
    command: ["node", "dist/worker.mjs"] # pg-boss: notificações, push e 08:00 (ADR-050)
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - itc-tasks-uploads:/data/uploads
    depends_on:
      itc-tasks-db:
        condition: service_healthy

  itc-tasks-db:
    image: postgres:18.6-alpine
    container_name: itc-tasks-db
    restart: always
    environment:
      - TZ=America/Sao_Paulo
      - POSTGRES_DB=itc_tasks
      - POSTGRES_USER=itc_tasks
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - itc-tasks-db-data:/var/lib/postgresql # Postgres 18: PGDATA em /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itc_tasks -d itc_tasks"]
      interval: 10s
      retries: 5

volumes:
  itc-tasks-uploads:
  itc-tasks-db-data:
