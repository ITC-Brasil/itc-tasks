services:
  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: itc
      POSTGRES_PASSWORD: itc
      POSTGRES_DB: itc_tasks
    ports: ["127.0.0.1:5435:5432"] # 5434 já é do NoteScan local; uma porta por projeto
    volumes:
      - db-data:/var/lib/postgresql # Postgres 18: PGDATA em /var/lib/postgresql/18/docker
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itc -d itc_tasks"]
      interval: 5s
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
volumes:
  db-data:
