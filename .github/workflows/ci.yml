name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: itc
          POSTGRES_PASSWORD: itc
          POSTGRES_DB: itc_tasks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itc -d itc_tasks_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://itc:itc@localhost:5432/itc_tasks_test
      DATABASE_URL_TEST: postgres://itc:itc@localhost:5432/itc_tasks_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
      BETTER_AUTH_URL: http://localhost:3000
      GLPI_BASE_URL: http://glpi.grupoitcbrasil.com.br:8888
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Migrations
        run: npm run db:migrate
      - name: Vitest with coverage
        run: npm run test:coverage
      - run: npm run build
      # Só dependências de produção: as cadeias de dev (eslint-config-next, drizzle-kit, shadcn) não têm correção publicada
      - run: npm audit --omit=dev --audit-level=high

  # ADR-055: E2E contra o build de produção, com banco descartável e seed gerado por execução
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: itc
          POSTGRES_PASSWORD: itc
          POSTGRES_DB: itc_tasks_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itc -d itc_tasks_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://itc:itc@localhost:5432/itc_tasks_e2e
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
      BETTER_AUTH_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      GLPI_BASE_URL: http://glpi.grupoitcbrasil.com.br:8888
      UPLOADS_DIR: ./data/uploads
      SEED_ADMIN_EMAIL: e2e@itcbr.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - name: Seed password (per run, masked)
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SEED_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npm run worker:build
      # o worker cria o schema pgboss (o /api/health e as escritas dependem dele, ADR-050)
      - name: Start worker and production server
        run: |
          node dist/worker.mjs > worker.log 2>&1 &
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && exit 0; sleep 2; done
          cat worker.log next.log; exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            next.log
            worker.log
          retention-days: 7

  # O build da imagem usa o .dockerignore, que o `npm run build` acima não exercita (PR #14)
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t itc-tasks:ci .
